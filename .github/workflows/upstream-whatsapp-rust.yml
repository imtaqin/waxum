name: Upstream whatsapp-rust

# Watches oxidezap/whatsapp-rust. When its main branch moves past the rev
# pinned in Cargo.toml, this builds and tests waxum against it and opens a pull
# request with the result, so a breaking change shows up as a named list of
# failing features instead of a surprise on the next manual bump.
#
# Without a token of its own the pull request is opened by github-actions[bot],
# needs the repository setting "Allow GitHub Actions to create and approve
# pull requests", and does not start other workflows, so the checks run here
# and their outcome is written into the pull request body. Set the
# UPSTREAM_BUMP_TOKEN secret to a fine-grained personal access token (contents
# and pull requests: read and write on this repository) and the commit and the
# pull request come from the token's owner instead, and CI runs on it too.
#
# The nicer option is the Waxum Sensei GitHub App: install it on this
# repository (contents, pull requests and workflows: read and write), set the
# repository variable WAXUM_SENSEI_APP_ID and the secret
# WAXUM_SENSEI_APP_PRIVATE_KEY, and the commit and the pull request come from
# waxum-sensei[bot] with CI running on them. It takes precedence over the PAT.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: never
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  UPSTREAM_REPO: oxidezap/whatsapp-rust

concurrency:
  group: upstream-whatsapp-rust
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      APP_KEY: ${{ secrets.WAXUM_SENSEI_APP_PRIVATE_KEY }}
    steps:
      - name: Mint a Waxum Sensei token
        id: app
        if: env.APP_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.WAXUM_SENSEI_APP_ID }}
          private-key: ${{ secrets.WAXUM_SENSEI_APP_PRIVATE_KEY }}

      - name: Pick the token and commit identity
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          PAT: ${{ secrets.UPSTREAM_BUMP_TOKEN }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            token="$APP_TOKEN"
            uid=$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
            name="${APP_SLUG}[bot]"
            email="${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
            own=true
          elif [ -n "$PAT" ]; then
            token="$PAT"
            name="taqin"
            email="cp@imtaqin.id"
            own=true
          else
            token="$DEFAULT_TOKEN"
            name="github-actions[bot]"
            email="41898282+github-actions[bot]@users.noreply.github.com"
            own=false
          fi
          echo "::add-mask::$token"
          {
            echo "GH_TOKEN=$token"
            echo "HAS_OWNER_TOKEN=$own"
            echo "GIT_NAME=$name"
            echo "GIT_EMAIL=$email"
          } >> "$GITHUB_ENV"
          echo "BUMP_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          token: ${{ env.BUMP_TOKEN }}

      - name: Find the pinned and the latest upstream rev
        id: revs
        run: |
          current=$(sed -nE 's|^whatsapp-rust = \{ git = "[^"]+", rev = "([0-9a-f]{40})".*|\1|p' Cargo.toml)
          latest=$(git ls-remote "https://github.com/${UPSTREAM_REPO}" HEAD | cut -f1)
          if [ -z "$current" ] || [ -z "$latest" ]; then
            echo "could not read the pinned or the latest rev" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "short=${latest:0:7}" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$latest" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when a pull request for this rev already exists
        id: existing
        if: steps.revs.outputs.needed == 'true'
        run: |
          branch="chore/upstream-whatsapp-rust-${{ steps.revs.outputs.short }}"
          open=$(gh pr list --head "$branch" --state open --json number --jq 'length')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          if [ "$open" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust nightly
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@nightly

      - name: Install rustfmt and clippy
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        run: rustup component add rustfmt clippy

      - name: Install dependencies
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libsqlite3-dev cmake build-essential

      - name: Cache cargo registry and git
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-upstream-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-upstream-

      - name: Move the pin to the latest rev
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          current='${{ steps.revs.outputs.current }}'
          latest='${{ steps.revs.outputs.latest }}'
          sed -i "s/${current}/${latest}/g" Cargo.toml vendor/whatsapp-rust-chat-store/Cargo.toml
          if ! cargo update -p whatsapp-rust > update.log 2>&1; then
            echo "targeted update refused, refreshing the whole lockfile" >> update.log
            cargo update >> update.log 2>&1
          fi
          cat update.log

      - name: Build and test against the new rev
        id: verify
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          set +e
          cargo check --all-targets > check.log 2>&1
          check=$?
          fmt=0
          clippy=0
          tests=0
          if [ "$check" = "0" ]; then
            cargo fmt --check > fmt.log 2>&1; fmt=$?
            cargo clippy --all-targets -- -D warnings > clippy.log 2>&1; clippy=$?
            cargo test --no-fail-fast > test.log 2>&1; tests=$?
          fi
          echo "check=$check" >> "$GITHUB_OUTPUT"
          echo "fmt=$fmt" >> "$GITHUB_OUTPUT"
          echo "clippy=$clippy" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          if [ "$check" = "0" ] && [ "$fmt" = "0" ] && [ "$clippy" = "0" ] && [ "$tests" = "0" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Write the report
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          current='${{ steps.revs.outputs.current }}'
          latest='${{ steps.revs.outputs.latest }}'
          {
            echo "Moves the pinned whatsapp-rust from \`${current:0:7}\` to \`${latest:0:7}\` (current upstream main)."
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            row() { if [ "$2" = "0" ]; then echo "| $1 | passed |"; else echo "| $1 | **failed** |"; fi; }
            row "cargo check (all targets)" "${{ steps.verify.outputs.check }}"
            if [ "${{ steps.verify.outputs.check }}" = "0" ]; then
              row "cargo fmt --check" "${{ steps.verify.outputs.fmt }}"
              row "cargo clippy -D warnings" "${{ steps.verify.outputs.clippy }}"
              row "cargo test" "${{ steps.verify.outputs.tests }}"
            else
              echo "| fmt, clippy, test | not run, the build does not compile |"
            fi
            echo
            if [ "${{ steps.verify.outputs.check }}" != "0" ]; then
              echo "### Compile errors"
              echo
              echo "Files in waxum that no longer compile, by area:"
              echo
              echo '```'
              grep -oE 'src/[a-z_/]+\.rs' check.log | sed -E 's|/[^/]+\.rs$||' | sort | uniq -c | sort -rn | head -15
              echo '```'
              echo
              echo "First errors:"
              echo
              echo '```'
              grep -E '^error' -A6 check.log | head -60
              echo '```'
            fi
            if [ "${{ steps.verify.outputs.tests }}" != "0" ] && [ "${{ steps.verify.outputs.check }}" = "0" ]; then
              echo "### Failing tests"
              echo
              echo "Each test file is one feature."
              echo
              echo '```'
              awk '/Running /{bin=$2} /^test .* FAILED$/{print bin ": " $2}' test.log | sed -E 's|^tests/||' | sort | head -60
              echo '```'
            fi
            if [ "${{ steps.verify.outputs.clippy }}" != "0" ] && [ "${{ steps.verify.outputs.check }}" = "0" ]; then
              echo "### Clippy"
              echo
              echo '```'
              grep -E '^(error|warning)' -A4 clippy.log | head -40
              echo '```'
            fi
            echo "### Upstream commits"
            echo
            gh api "repos/${UPSTREAM_REPO}/compare/${current}...${latest}" \
              --jq '.commits[] | "- " + (.sha[0:7]) + " " + (.commit.message | split("\n")[0])' 2>/dev/null | head -60 || true
            echo
            echo "Opened by the Upstream whatsapp-rust workflow. Update notes from cargo:"
            echo
            echo '```'
            head -40 update.log
            echo '```'
          } > report.md
          cat report.md

      - name: Open the pull request
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          branch='${{ steps.existing.outputs.branch }}'
          short='${{ steps.revs.outputs.short }}'
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock vendor/whatsapp-rust-chat-store/Cargo.toml
          git commit -m "chore(deps): bump whatsapp-rust to ${short}"
          git push --force origin "$branch"
          gh label create upstream-break --color B60205 --description "whatsapp-rust upstream breaks waxum" 2>/dev/null || true
          gh label create upstream-bump --color 0E8A16 --description "Automatic whatsapp-rust bump" 2>/dev/null || true
          if [ "${{ steps.verify.outputs.green }}" = "true" ]; then
            gh pr create --base main --head "$branch" \
              --title "chore(deps): bump whatsapp-rust to ${short}" \
              --body-file report.md --label upstream-bump
          else
            gh pr create --base main --head "$branch" --draft \
              --title "chore(deps): bump whatsapp-rust to ${short} (breaks waxum)" \
              --body-file report.md --label upstream-bump --label upstream-break
          fi

      - name: Close superseded bump pull requests
        if: steps.revs.outputs.needed == 'true' && steps.existing.outputs.skip == 'false'
        run: |
          current_branch='${{ steps.existing.outputs.branch }}'
          gh pr list --state open --label upstream-bump --json number,headRefName \
            --jq '.[] | select(.headRefName != "'"$current_branch"'") | .number' |
          while read -r number; do
            gh pr close "$number" --delete-branch \
              --comment "Superseded by a newer whatsapp-rust bump."
          done

      - name: Remove bump branches that have no open pull request
        if: steps.revs.outputs.needed == 'true'
        run: |
          current_branch='chore/upstream-whatsapp-rust-${{ steps.revs.outputs.short }}'
          open=$(gh pr list --state open --json headRefName --jq '.[].headRefName')
          git ls-remote --heads origin 'chore/upstream-whatsapp-rust-*' | sed 's|.*refs/heads/||' |
          while read -r branch; do
            [ "$branch" = "$current_branch" ] && continue
            echo "$open" | grep -qx "$branch" && continue
            git push origin --delete "$branch" || true
          done
