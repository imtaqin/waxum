name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install rustfmt and clippy
        run: |
          rustup component add rustfmt clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libsqlite3-dev cmake build-essential

      # NOTE: `target/` is intentionally excluded from the cache. Some
      # crates (utoipa-swagger-ui, protoc-gen builds) bake absolute
      # build-directory paths into generated code, so restoring a
      # `target/` produced under a different repo path (e.g. an older
      # wa-rs → waxum rename) makes those crates fail to link with
      # "folder does not exist". Caching only the registry keeps cold
      # rebuilds cheap without dragging in path-poisoned artifacts.
      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-waxum-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-waxum-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build (release)
        run: cargo build --release

      # `~/.cargo/bin` is already in the cache above, so cargo-audit only
      # needs building from source once; later runs reuse the cached binary.
      - name: Install cargo-audit (if not cached)
        run: command -v cargo-audit || cargo install cargo-audit --locked

      # --ignore entries mirror audit.toml (kept in the repo root as the
      # human-readable record of *why* each is ignored) -- passed
      # explicitly here since not every cargo-audit version auto-loads
      # that file. A new advisory not in this list still fails the job.
      - name: Audit dependencies for known vulnerabilities
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0382 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369
